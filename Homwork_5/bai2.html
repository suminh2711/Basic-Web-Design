<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinh viên</title>
</head>

<body>
    <script>
        var sinhvien = {
            Name: "Y Su Minh",
            Year: 2007,
            Gender: "Nữ",
            HomeTown: "Kon Tum",

        for (x in sinhvien) {
            document.write(x + " : " + sinhvien[x] + "<br>");
        }
    </script>
</body>
